<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#111">
  <title>Disc Follow Flight</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- ── Upload screen ── -->
  <div id="upload-screen" class="screen active">
    <div class="upload-content">
      <h1>Disc Follow Flight</h1>
      <div class="upload-divider"></div>
      <p class="tagline">Trace your disc's flight path frame by frame</p>
      <label class="upload-btn" for="video-input">Choose Video</label>
      <input type="file" id="video-input" accept="video/*">
      <p class="hint">Pick a throw from your camera roll</p>
    </div>
  </div>

  <!-- ── Editor screen ── -->
  <div id="editor-screen" class="screen">

    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>

    <div id="controls">

      <div id="top-row">
        <span id="frame-label">Frame 0 / 0</span>
        <span id="fps-toggle" title="Tap to toggle frame rate">30 fps</span>
        <span id="mark-count">0 marks</span>
      </div>

      <input type="range" id="scrubber" min="0" max="0" value="0" step="1">

      <div id="nav-row">
        <button class="nav-btn" id="btn-m10">−10</button>
        <button class="nav-btn large" id="btn-prev">&#9664;</button>
        <button class="nav-btn large" id="btn-next">&#9654;</button>
        <button class="nav-btn" id="btn-p10">+10</button>
      </div>

      <div id="action-row">
        <button class="action-btn" id="btn-undo">Undo</button>
        <button class="action-btn" id="btn-clear">Clear</button>
      </div>

      <div id="export-row">
        <button class="action-btn export" id="btn-export">Export Video</button>
      </div>

      <div class="ctrl-label">Shot trace color</div>
      <div id="gradient-row"></div>

      <div class="ctrl-label-row">
        <span>Trace width</span>
        <span id="width-value">12</span>
      </div>
      <input type="range" class="ctrl-slider" id="trace-width" min="1" max="24" value="12" step="1">

      <div class="ctrl-label-row">
        <span>Width gradient</span>
        <span id="taper-value">Wide → Narrow</span>
      </div>
      <input type="range" class="ctrl-slider" id="trace-taper" min="-10" max="10" value="10" step="1">

      <div class="ctrl-label-row">
        <span>Trace opacity</span>
        <span id="opacity-value">100%</span>
      </div>
      <input type="range" class="ctrl-slider" id="trace-opacity" min="10" max="100" value="100" step="5">

      <div id="status">Tap on the disc to mark its position</div>

    </div>
  </div>

  <!-- Export progress overlay -->
  <div id="export-overlay" hidden>
    <div id="export-card">
      <p id="export-status">Exporting…</p>
      <div id="export-bar-wrap"><div id="export-bar-fill"></div></div>
      <p id="export-pct">0%</p>
      <button id="btn-cancel-export">Cancel</button>
    </div>
  </div>

  <!-- Hidden video element used only for frame decoding -->
  <video id="video" preload="auto" playsinline muted></video>

  <script src="app.js"></script>
</body>
</html>
