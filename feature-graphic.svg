<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>

    <!-- Background gradient: slightly warmer on left, cooler right -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#141210"/>
      <stop offset="55%"  stop-color="#111111"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>

    <!-- Trail fades from transparent → solid orange -->
    <linearGradient id="trailGrad" x1="380" y1="462" x2="938" y2="82"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F97316" stop-opacity="0"/>
      <stop offset="28%"  stop-color="#F97316" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="1"/>
    </linearGradient>

    <!-- Glow on the trail stroke -->
    <filter id="trailGlow" x="-15%" y="-120%" width="130%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow behind disc -->
    <filter id="discGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft orange aura behind disc -->
    <radialGradient id="aura" cx="938" cy="82" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F97316" stop-opacity="0.20"/>
      <stop offset="60%"  stop-color="#F97316" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm vignette on left side (text area depth) -->
    <radialGradient id="leftDepth" cx="0%" cy="50%" r="55%"
                    gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#1c1408" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- ── Background ── -->
  <rect width="1024" height="500" fill="url(#bgGrad)"/>
  <rect width="1024" height="500" fill="url(#leftDepth)"/>

  <!-- Disc ambient aura -->
  <ellipse cx="938" cy="82" rx="250" ry="210" fill="url(#aura)"/>

  <!-- ── Flight trail ── -->
  <path d="M 380 462 C 532 392 704 262 938 82"
        stroke="url(#trailGrad)"
        stroke-width="5"
        stroke-linecap="round"
        fill="none"
        filter="url(#trailGlow)"/>

  <!-- ── Frame-by-frame tracking dots ── -->
  <!-- Computed along the cubic bezier; opacity + size ramp up toward disc -->
  <circle cx="426" cy="437" r="5.0" fill="#F97316" opacity="0.18"/>
  <circle cx="473" cy="411" r="5.5" fill="#F97316" opacity="0.28"/>
  <circle cx="523" cy="381" r="6.0" fill="#F97316" opacity="0.38"/>
  <circle cx="574" cy="348" r="6.5" fill="#F97316" opacity="0.48"/>
  <circle cx="629" cy="311" r="7.0" fill="#F97316" opacity="0.58"/>
  <circle cx="687" cy="271" r="7.5" fill="#F97316" opacity="0.68"/>
  <circle cx="749" cy="228" r="8.0" fill="#F97316" opacity="0.78"/>
  <circle cx="814" cy="181" r="8.5" fill="#F97316" opacity="0.87"/>
  <circle cx="885" cy="131" r="9.0" fill="#F97316" opacity="0.95"/>

  <!-- ── Disc at trail tip ── -->
  <g transform="translate(938, 82) rotate(-24)" filter="url(#discGlow)">
    <!-- Outer rim / flange -->
    <ellipse cx="0" cy="0"  rx="65" ry="26" fill="#EEEEEE"/>
    <ellipse cx="0" cy="0"  rx="65" ry="26" fill="none" stroke="#D5D5D5" stroke-width="3"/>
    <!-- Flight plate (inner raised area) -->
    <ellipse cx="-1" cy="-2" rx="40" ry="15" fill="#F5F5F5"/>
    <!-- Dome specular highlight -->
    <ellipse cx="-9" cy="-8" rx="19" ry="7"  fill="white" opacity="0.85"/>
    <!-- Centre pip -->
    <ellipse cx="0"  cy="-1" rx="9"  ry="3.5" fill="#CCCCCC"/>
  </g>

  <!-- ── App wordmark ── -->
  <text x="60" y="228"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="90" font-weight="700" letter-spacing="-2">
    <tspan fill="#FFFFFF">Disc</tspan><tspan fill="#F97316">Trail</tspan>
  </text>

  <!-- ── Tagline ── -->
  <text x="65" y="272"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="21" font-weight="400" fill="#999999" letter-spacing="0.6">
    Map every shot. Master your flight.
  </text>

  <!-- Orange accent rule below tagline -->
  <line x1="65" y1="293" x2="362" y2="293"
        stroke="#F97316" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

</svg>
